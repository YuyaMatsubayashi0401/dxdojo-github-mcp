<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>水曜のDX道場 — GitHub MCP ハンズオン</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background: #fffdf5;
      color: #333;
    }
    .card {
      background: #ffffff;
    }
    h1 {
      color: #ff6b35;
      font-size: 3rem;
    }
    .lead {
      color: #555;
      font-size: 1.4rem;
      line-height: 1.8;
    }
    .edit-me h2 {
      color: #00a878;
      font-size: 2rem;
    }
    #message {
      color: #0066cc;
      font-size: 2.5rem;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <main class="card">
    <p class="label">水曜のDX道場</p>
    <h1>GitHub MCP ハンズオン</h1>
    <p class="lead">
      このページは <strong>GitHub Actions</strong> によって自動デプロイされています。<br>
      <code>main</code> ブランチに push されると、数十秒後にこのページが更新されます。
    </p>

    <!-- ▼▼▼ ハンズオンではここを編集します ▼▼▼ -->
    <section class="edit-me">
      <h2>参加者メッセージ</h2>
      <p id="message">Hello Github MCP〜</p>
    </section>
    <!-- ▲▲▲ ハンズオンではここを編集します ▲▲▲ -->

    <footer>
      <p>デプロイ回数: <span class="badge">v1</span></p>
    </footer>
  </main>
</body>
</html>
